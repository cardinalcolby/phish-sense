<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishSense: Don't Get Hooked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo-badge.svg" alt="PhishSense logo" class="logo" />
    <h1>Phish<span>Sense</span></h1>
    <p class="tagline">Don't get hooked.</p>
  </header>

  <main>
    <!-- Screen 1: Start -->
    <section id="start-screen" class="screen">
      <p class="intro">You work at <b>Bayline Energy</b>.<br />
        Company email: <b>@bayline-energy.com</b> · Main line: <b>(404) 555-0100</b><br />
        Sort your inbox: <b>Phish</b> or <b>Legit</b>?</p>
      <input id="username" placeholder="Your name" maxlength="20" />
      <div class="modes">
        <button class="mode" data-mode="easy">🐟 Easy<br /><small>Minnow badge</small></button>
        <button class="mode" data-mode="medium">🎣 Medium<br /><small>Angler badge</small></button>
        <button class="mode" data-mode="hard">⚓ Hard<br /><small>Captain badge</small></button>
      </div>
      <div id="my-badges"></div>
    </section>

    <!-- Screen 2: Play -->
    <section id="play-screen" class="screen hidden">
      <p id="progress"></p>
      <div id="message" class="card"></div>
      <div class="answers">
        <button id="btn-phish" class="answer phish">🎣 Phish</button>
        <button id="btn-legit" class="answer legit">✅ Legit</button>
      </div>
      <div id="result" class="card hidden"></div>
      <button id="btn-next" class="hidden">Next</button>
    </section>

    <!-- Screen 3: End of run -->
    <section id="end-screen" class="screen hidden">
      <h2 id="end-title"></h2>
      <p id="end-text"></p>
      <button id="btn-home">Back to modes</button>
    </section>

    <!-- Leaderboard (always visible) -->
    <section class="card leaderboard">
      <h3>🏆 Leaderboard</h3>
      <ol id="leaderboard"></ol>
    </section>
  </main>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
